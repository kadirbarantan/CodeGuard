# Alembic: veritabanı tablolarını kuran ve güncelleyen göçler (migration).
# Veritabanı adresi burada değil, .env'deki DATABASE_URL'de (bkz. alembic/env.py).
#   alembic upgrade head                              → tabloları kur / son sürüme getir
#   alembic revision --autogenerate -m "açıklama"     → modeller.py değişince yeni göç üret

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
